  <text x="50" y="31" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">CryptoTrace™</text>
  <rect x="155" y="17" width="110" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
