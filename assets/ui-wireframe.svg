  <path d="M 0 0 L 0 750 M 50 0 L 50 750 M 100 0 L 100 750 M 150 0 L 150 750 M 200 0 L 200 750 M 250 0 L 250 750 M 300 0 L 300 750 M 350 0 L 350 750 M 400 0 L 400 750 M 450 0 L 450 750 M 500 0 L 500 750 M 550 0 L 550 750 M 600 0 L 600 750 M 650 0 L 650 750 M 700 0 L 700 750 M 750 0 L 750 750 M 800 0 L 800 750 M 850 0 L 850 750 M 900 0 L 900 750 M 950 0 L 950 750 M 1000 0 L 1000 750 M 1050 0 L 1050 750 M 1100 0 L 1100 750 M 1150 0 L 1150 750" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>

