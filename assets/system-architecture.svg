<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="box-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyan-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1100" height="620" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="550" y="40" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="1">CryptoTrace™ System Architecture Blueprint</text>
  <text x="550" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">Modular Monorepo Architecture for Anti-Narcotics Cryptocurrency Intelligence</text>

  <!-- LAYER 1: FRONTEND PRESENTATION TIER -->
  <g transform="translate(50, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="1000" height="85" rx="8" fill="url(#box-grad-1)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="1000" height="24" rx="8" fill="#1e3a8a" fill-opacity="0.6"/>
    <text x="16" y="16" fill="#60a5fa" font-size="11" font-weight="800" letter-spacing="0.5">LAYER 1: PRESENTATION TIER (apps/web - Next.js 14 App Router)</text>
    
    <!-- Sub-components -->
    <g transform="translate(16, 34)">
      <!-- Omnibar -->
      <rect x="0" y="0" width="180" height="40" rx="5" fill="#1e293b" stroke="#334155"/>
      <text x="90" y="24" fill="#f1f5f9" font-size="11" font-weight="600" text-anchor="middle">Omnibar &amp; Input Validation</text>
      
      <!-- Graph Canvas -->
      <rect x="195" y="0" width="210" height="40" rx="5" fill="#1e293b" stroke="#38bdf8"/>
      <text x="300" y="24" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">React Flow Interactive Visualizer</text>
      
      <!-- Inspector Drawer -->
      <rect x="420" y="0" width="180" height="40" rx="5" fill="#1e293b" stroke="#334155"/>
      <text x="510" y="24" fill="#f1f5f9" font-size="11" font-weight="600" text-anchor="middle">Entity Inspector &amp; Gauge</text>
      
      <!-- AI Copilot UI -->
      <rect x="615" y="0" width="170" height="40" rx="5" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="700" y="24" fill="#c7d2fe" font-size="11" font-weight="600" text-anchor="middle">✨ AI Copilot Drawer</text>

      <!-- Subpoena Dossier Modal -->
      <rect x="798" y="0" width="170" height="40" rx="5" fill="#064e3b" stroke="#10b981"/>
      <text x="883" y="24" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">📜 Legal Report Modal</text>
    </g>
  </g>

  <!-- Arrow L1 -> L2 -->
  <path d="M 550 175 L 550 200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="545,198 550,206 555,198" fill="#38bdf8"/>

  <!-- LAYER 2: BACKEND REST API & CONTROLLER TIER -->
  <g transform="translate(50, 208)" filter="url(#shadow)">
    <rect x="0" y="0" width="1000" height="75" rx="8" fill="url(#box-grad-1)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="0" y="0" width="1000" height="24" rx="8" fill="#0891b2" fill-opacity="0.4"/>
    <text x="16" y="16" fill="#22d3ee" font-size="11" font-weight="800" letter-spacing="0.5">LAYER 2: API &amp; ORCHESTRATION SERVER (apps/api - Fastify 4 Node.js / Bun 1.3)</text>
    
    <g transform="translate(16, 32)">
      <rect x="0" y="0" width="220" height="32" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="110" y="20" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">/api/investigations (POST/GET)</text>

      <rect x="235" y="0" width="220" height="32" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="345" y="20" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">/api/demo/cases (Preset Scenarios)</text>

      <rect x="470" y="0" width="220" height="32" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="580" y="20" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">/api/ai/query (Copilot Engine)</text>

      <rect x="705" y="0" width="263" height="32" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="836" y="20" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">OpenAPI / Swagger Specs (/docs)</text>
    </g>
  </g>

  <!-- Arrow L2 -> L3 -->
  <path d="M 550 283 L 550 308" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="545,306 550,314 555,306" fill="#06b6d4"/>

  <!-- LAYER 3: FORENSIC CORE & ANALYTICS PACKAGES -->
  <g transform="translate(50, 316)" filter="url(#shadow)">
    <rect x="0" y="0" width="1000" height="155" rx="8" fill="url(#box-grad-1)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="1000" height="24" rx="8" fill="#5b21b6" fill-opacity="0.4"/>
    <text x="16" y="16" fill="#c4b5fd" font-size="11" font-weight="800" letter-spacing="0.5">LAYER 3: CORE FORENSIC ENGINE PACKAGES (packages/*)</text>

    <g transform="translate(16, 34)">
      <!-- Package: analysis -->
      <rect x="0" y="0" width="230" height="105" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="115" y="20" fill="#a5b4fc" font-size="11" font-weight="800" text-anchor="middle">packages/analysis</text>
      <text x="12" y="42" fill="#cbd5e1" font-size="9">• 7 Suspicious Rule Engines</text>
      <text x="12" y="57" fill="#cbd5e1" font-size="9">• Mixer &amp; Bridge Detectors</text>
      <text x="12" y="72" fill="#cbd5e1" font-size="9">• Peel Chain &amp; Fan-In/Out</text>
      <text x="12" y="87" fill="#cbd5e1" font-size="9">• Rapid Velocity Transit</text>

      <!-- Package: graph -->
      <rect x="245" y="0" width="230" height="105" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="360" y="20" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle">packages/graph</text>
      <text x="257" y="42" fill="#cbd5e1" font-size="9">• Directed Weighted Multigraph</text>
      <text x="257" y="57" fill="#cbd5e1" font-size="9">• Graphology Model Engine</text>
      <text x="257" y="72" fill="#cbd5e1" font-size="9">• Dijkstra Shortest Path</text>
      <text x="257" y="87" fill="#cbd5e1" font-size="9">• BFS/DFS Bounded Traversal</text>

      <!-- Package: risk & entities -->
      <rect x="490" y="0" width="230" height="105" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
      <text x="605" y="20" fill="#fca5a5" font-size="11" font-weight="800" text-anchor="middle">packages/risk &amp; entities</text>
      <text x="502" y="42" fill="#cbd5e1" font-size="9">• Calibrated 0-100 Risk Engine</text>
      <text x="502" y="57" fill="#cbd5e1" font-size="9">• Evidence Provenance Trail</text>
      <text x="502" y="72" fill="#cbd5e1" font-size="9">• Attributed Entity Database</text>
      <text x="502" y="87" fill="#cbd5e1" font-size="9">• Legal 3-Tier Categorization</text>

      <!-- Package: clustering & ai -->
      <rect x="735" y="0" width="233" height="105" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="851" y="20" fill="#6ee7b7" font-size="11" font-weight="800" text-anchor="middle">packages/clustering &amp; ai</text>
      <text x="747" y="42" fill="#cbd5e1" font-size="9">• Bitcoin CIOH Co-Spend Rules</text>
      <text x="747" y="57" fill="#cbd5e1" font-size="9">• Change Address Discovery</text>
      <text x="747" y="72" fill="#cbd5e1" font-size="9">• AI NL Query Tool Dispatcher</text>
      <text x="747" y="87" fill="#cbd5e1" font-size="9">• Statutory Subpoena Checklist</text>
    </g>
  </g>

  <!-- Arrow L3 -> L4 -->
  <path d="M 550 471 L 550 496" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="545,494 550,502 555,494" fill="#8b5cf6"/>

  <!-- LAYER 4: BLOCKCHAIN DATA & INGESTION LAYER -->
  <g transform="translate(50, 504)" filter="url(#shadow)">
    <rect x="0" y="0" width="1000" height="75" rx="8" fill="url(#box-grad-1)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="1000" height="24" rx="8" fill="#78350f" fill-opacity="0.4"/>
    <text x="16" y="16" fill="#fde68a" font-size="11" font-weight="800" letter-spacing="0.5">LAYER 4: BLOCKCHAIN ADAPTER &amp; DATA INGESTION TIER (packages/blockchain)</text>

    <g transform="translate(16, 32)">
      <!-- Bitcoin Scanner -->
      <rect x="0" y="0" width="220" height="32" rx="4" fill="#1e293b" stroke="#f59e0b"/>
      <text x="110" y="20" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">₿ Blockstream API (BTC UTXO)</text>

      <!-- Ethereum & Token Scanner -->
      <rect x="235" y="0" width="260" height="32" rx="4" fill="#1e293b" stroke="#627eea"/>
      <text x="365" y="20" fill="#a5b4fc" font-size="10" font-weight="600" text-anchor="middle">⬡ Blockscout v2 API (ETH / USDT Logs)</text>

      <!-- Monero Guardrail -->
      <rect x="510" y="0" width="220" height="32" rx="4" fill="#1e293b" stroke="#d97706"/>
      <text x="620" y="20" fill="#fed7aa" font-size="10" font-weight="600" text-anchor="middle">🔒 Monero XMR Guardrails</text>

      <!-- Synthetic Demo Scenarios -->
      <rect x="745" y="0" width="223" height="32" rx="4" fill="#065f46" stroke="#34d399"/>
      <text x="856" y="20" fill="#a7f3d0" font-size="10" font-weight="600" text-anchor="middle">🔵 Synthetic Demo Engine (Offline Scenarios)</text>
    </g>
  </g>
</svg>
